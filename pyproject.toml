[project]
name = "synthetic-ux-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "requests>=2.32,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]
persona = ["dspy==3.3.0"]
production = ["alembic>=1.16,<2", "boto3>=1.40,<2", "celery[redis]>=5.5,<6", "psycopg[binary]>=3.2,<4", "pyjwt[crypto]>=2.10,<3", "sqlalchemy>=2.0,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
